# Colors use MiniMessage format. For more info visit https://docs.advntr.dev/minimessage/format.html
#  - <color:#RRGGBB>This is a HEX colored text
#  - <gradient:#RRGGBB:#RRGGBB>This is gradient text</gradient>
#  - <rainbow>This is rainbow text</rainbow>

Settings:
  Debug: false

  # Please do not change this, is used to auto-updating! Thanks
  Version: 2.2.7

  AutoSave:
    # If enabled, plugin will save block data automatically to database per some time
    # denying plugin data loss on server crash.
    Enabled: true
    # Time in seconds between saves. Lower time = lower rollback on crash
    # Recommended time is 5 minutes (300s), same as bukkit auto-save time
    Time: 300

  Database:
    # Types: SQLITE | MYSQL | HIKARI
    # If using SQLITE ignore everything bellow
    Type: SQLITE
    Login:
      Host: localhost
      User: root
      Pass: password
      Port: 3306
      DB: database
    Hikari:
      MaximumPoolSize: 10
      KeepAliveMs: 0

  Holograms:
    # If enabled, plugin will try to hook into hologram provider.
    Enabled: false
    # Providers: DecentHolograms, FancyHolograms
    # If you know any other ones. Feel free to contact me about hooking them.
    Provider: NONE

  Placeholders:
    Enabled: true
    # Configuration for percentage placeholder
    Percentage:
      Total: 5
      Tiles:
        Low: "<color:#f01f1f>■"
        Half: "<color:#05fa11>■"
        Full: "<dark_green>⬛"