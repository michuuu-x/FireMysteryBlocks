plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'maven-publish'
}

group 'FireMysteryBlocks'
version = "2.3.18"

compileJava.options.encoding = "UTF-8"
compileTestJava.options.encoding = "UTF-8"

dependencies {
//    implementation project(":API")
//    implementation fileTree("archive")

    // Server jars
    compileOnly("io.papermc.paper:paper-api:26.2.build.+")

    // Addons
    compileOnly 'me.clip:placeholderapi:2.12.3'
    compileOnly 'de.oliver:FancyHolograms:2.10.0'
    compileOnly 'com.github.decentsoftware-eu:decentholograms:2.10.1'

    // Implementations
    implementation("com.zaxxer:HikariCP:7.1.0")
}

allprojects {
    apply plugin: 'java'
    apply plugin: 'com.gradleup.shadow'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://jitpack.io' }
        maven { url = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/' }
        maven { url = 'https://oss.sonatype.org/content/repositories/snapshots' }
        maven { url = 'https://repo.extendedclip.com/releases/' }
        maven { url = 'https://repo.fancyinnovations.com/releases' }
        maven {
            name = "papermc"
            url = uri("https://repo.papermc.io/repository/maven-public/")
        }
    }

    dependencies {
        // Annotation
        compileOnly 'org.jetbrains:annotations:24.0.0'
        compileOnly 'org.projectlombok:lombok:1.18.46'
        annotationProcessor 'org.projectlombok:lombok:1.18.46'
    }

    build {
        dependsOn shadowJar
    }
}

subprojects {
    shadowJar {
        archiveFileName = "${project.group}-${project.name}-${rootProject.version}.jar"
        destinationDirectory = file("../target/${rootProject.version}")
    }
}

shadowJar {
    dependsOn(jar)

    delete fileTree("./target/") {
        exclude archiveFileName.get()
    }

    // Relocate
    relocate 'de.tr7zw.changeme.nbtapi', 'cz.devfire.mysteryblocks.nbtapi'

    archiveFileName = "${project.name}-${project.version}.jar"
    destinationDirectory = file("target/${rootProject.version}")
}

processResources {
    outputs.upToDateWhen { false }

    eachFile { details ->
        if (details.name.contentEquals('plugin.yml') || details.name.contentEquals('bungee.yml')) {
            filter { String line ->
                line.replace('${project.version}', (String) version)
            }
        }
    }
}

build {
    dependsOn clean
    dependsOn shadowJar
}

publish.shouldRunAfter shadowJar
