# Ways to use Gradient or HEX colors. For more info visit https://www.spigotmc.org/resources/iridiumcolorapi.87351/
#  - <GRADIENT:FirstHexColor>This is gradient text</GRADIENT:SecondHexColor> | <GRADIENT:FFFFFF>
#  - <SOLID:HexColor>This is solid HEX color string | <SOLID:FFFFFF>
#  - <RAINBOW>This is rainbow text</RAINBOW>

Settings:
  # Used to see debug values. If you dont know why plugin is not working and
  # you know at least something about java and bukkit-api. Feel free to find that problem.
  Debug: false

  AutoSave:
    # If enabled, plugin will save block data to database per some time
    # denying plugin data loss on server crash. There will be rollback still
    # rollback, but smaller than full block data gone.
    Enabled: true
    # Time in seconds between saves. Lower time = lower rollback on crash
    # Recommended time is 5 minutes (300s), same as bukkit autosave time
    Time: 300

  Database:
    # Types: SQLITE | MYSQL
    # If using SQLITE ignore login values bellow.
    Type: SQLITE
    Login:
      Host: localhost
      User: root
      Pass: password
      Port: 3306
      DB: database

  Holograms:
    # If enabled, plugin will try to hook into other plugin hologram system.
    Enabled: false
    # Providers: CMI, HolographicDisplays, DecentHolograms
    # If you know any other ones. Feel free to contact me about hooking them.
    Provider: NONE

  Placeholders:
    Enabled: true