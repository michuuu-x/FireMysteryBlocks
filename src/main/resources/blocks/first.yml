# Action format: [TYPE] [VALUE]
#
# Action types:
#   [COMMAND] - Execute command as player
#   [OP-COMMAND] - Execute command as oped player
#   [CONSOLE-COMMAND] - Execute command from console
#   [MESSAGE] - Sends player message
#   [BROADCAST] - Sends everyone message
#   [SOUND] - Play a sound to player.. Format: SOUND-VOLUME-PITCH
#   [ACTIONBAR] - Show player action bar message
# Cache (Offline rewards system):
#   If command starts with $ and player is offline, that command
#   will be saved and then executed after player is back online.
#   When player is online, action will work like normal
#    - Example: [COMMAND] $give {0} diamond 5
#    - Example: [SOUND] $BLOCK_ANVIL_LAND-1-1
# Percentage:
#   If command starts with @number@, that command will be executed
#   only with certain percentage
#    - Example: [COMMAND] $@10@give {0} diamond 5
#    - Example: [MESSAGE] $@50@You doing well!
# Placeholders:
#  - {0} - Block name
#  - {1} - Block material
#  - {2} - Player Name
#  - {3} - Block Current mines ASC
#  - {4} - Block Current mines DESC
#  - {5} - Block Required mines
#  - {6} - Player Current Mines
#  - {7} - Player Current Mine speed
#  - {8}, {9}, {10} - Cooldown time .. FORMATTED, SHORT, PLAIN
#  - {pos-1-name} and {pos-1-value} - First position name and mine count.
#        !! MAX 10 Values !!        - Works only in OnDestroy-Global and Holograms
#
# ! To disable any of events place [] instead of list

Block:
  Material: STONE
  Location: world/0/100/0
  # Count of block mines required to destroy block and get rewards.
  Limit: 10
  # To disable item damage, set this to 0
  ItemDamage: 1
  # If enabled, player will need specific permission to be able to mine this block
  # Perm: "firemysteryblocks.mine.BLOCKNAME"
  Permission: false

Cooldown:
  # If enabled, block will be unminable for specific time.
  # After that time, block will be regenerated back.
  # After is mined, block will to turn to material specific bellow.
  Enabled: true
  # Time is set in milliseconds
  Time: 300000
  # Material that will block be set when is inactive
  Material: BEDROCK

EnchantLimit:
  # If enabled, player items will be limited from mining with higher enchants then allowed once
  # Enchantments must be used from https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/enchantments/Enchantment.html
  Enabled: false
  List:
    - "DIG_SPEED:5"

MiningEffects:
  # If enabled, player will have specific effect when mining this block
  # Effect must be used from https://hub.spigotmc.org/javadocs/bukkit/org/bukkit/potion/PotionEffectType.html
  Enabled: false
  List:
    - "SLOW_DIGGING:1"

AntiCheat:
  # If enabled, player mining speed per interval will be checked,
  # when mining speed is above specified limit, actions will be performer
  # This tries to detect player with fastbreak, for every block,
  # you NEED TO CONFIGURE IT by yourself for how fast player can normally mine!
  Enabled: true
  # Time in millis for witch mine counts
  # Example. 1000 -> 20 mines per 1000 milliseconds with Effi 5 and Haste 2
  Time: 1000
  # Time in milliseconds after which commands will be repeated.
  # If player has over 2 mines/second, WARN command will be executed every 30s till player stops mining
  # If action is 0, cooldown is bypassed
  Cooldown: 30000
  # If player have minespeed above 8, all block breaks will be ignored
  # Set to -1 if you want to ignore it
  Break: 6
  # Action performer after player reach limit
  Action:
    2:
      - "[WARN] {2} is mining block {0} too fast!"
    6:
      - "[COMMAND] kick {2} You are mining block {0} too fast!"

AntiAFK:
  # If enabled, players that are mining will be randomly blocked depends on method
  # to stop them from afk mining.
  Enabled: false
  # Type: KNOCKBACK, CAPTCHA
  Selected: NONE
  # Chance from 0.0 to 100
  Chance: 10
  Methods:
    Knockback:
      # How much you want to throw player away...
      Power: 1
    Captcha:
      # When enabled, players that won't complete captcha under limit, will be treated as they failed.
      Time:
        Enabled: true
        # Time in milliseconds
        Limit: 30000
      Inventory:
        # Sizes allowed: 5, 9, 18, 27, 36, 45, 56
        Size: 5
        # Enabling this, will ignore if player clicks on empty item in inventory
        SkipBank: false
        # Material that will be used in menu
        Active:
          Material: "BEDROCK"
          DisplayName: "&c&lCAPTCHA ITEM"
          Lore:
            - "&r"
            - "&7 Click this item to verify you there &r"
            - "&r"
        # Material that will be filled in all other slots
        Fill:
          Enabled: false
          Item:
            Material: "WHITE_STAINED_GLASS_PANE"
            DisplayName: "&r"
            Lore: []
      Action:
        OnFail:
          - "[CONSOLE-COMMAND] kick {2} Failed CAPTCHA"
        OnSuccess:
          - "[MESSAGE] &c&lFireMysteryBlocks &8&l» &7Captcha was successfully checked!"

Hologram:
  # If enabled, holograms will be placed above this block
  # Its required to have holograms enabled in settings and right provider selected!
  Enabled: true
  # Vault Injection
  # If set to true, placeholder {pos-1-name} will be injected with prefix and suffix of supported vault plugin
  NameInjection:
    Enabled: false
    Inject:
      Prefix: "%vault_prefix% "
      Suffix: " %vault_suffix%"
  # Active is set when there is no cooldown on block
  # Inactive is set when cooldown is active
  State:
    Inactive:
      Lines:
        - "&6&lThis is {0} block"
        - ""
        - "Current mines: &e{3}/{5}"
        - ""
        - "1. {pos-1-name} - {pos-1-value}x"
        - "2. {pos-2-name} - {pos-2-value}x"
        - "3. {pos-3-name} - {pos-3-value}x"
        - ""
        - "&7*Block will regenerate after.. &a{9}&7*"
      Y-Offset: 2
    Active:
      Lines:
        - "&6&lThis is {0} block"
        - ""
        - "Current mines: &e{3}/{5}"
        - ""
        - "1. {pos-1-name} - {pos-1-value}x"
        - "2. {pos-2-name} - {pos-2-value}x"
        - "3. {pos-3-name} - {pos-3-value}x"
        - ""
        - "&7* Break this block to get rewards *"
      Y-Offset: 2
  # Additional configurations for Holograms
  Providers:
    CMI:
      # Perm: cmi.hologram.FMB-BLOCKNAME
      #  BlockName is the name of file without .yml at the end
      RequirePerms: false
      # Set LOSInterval to 0 to disable
      LOSInterval: 0
      TextDownOrder: true
      TextSpacing: 0.25
      IconSpacing: 0.5
      ShowRange: 8
      UpdateRange: 8
      # Set UpdateInterval to 0 to disable
      UpdateInterval: 0
    HolographicDisplays:
      AllowPlaceholders: false
    DecentHolograms:
      # Perm: decentholograms.hologram.FMB-BLOCKNAME
      #  BlockName is the name of file without .yml at the end
      RequirePerms: false
      UpdateRange: 48
      ShowRange: 48
      TextDownOrder: false
      AlwaysFacePlayer: false
      Facing: 0
      # Set UpdateInterval to 0 to disable
      UpdateInterval: 2

Action:
  OnReset:
    - "[SOUND] UI_TOAST_CHALLENGE_COMPLETE-1-1"
    - "[BROADCAST] &6&lMysteryBlocks &8&l» &7Block &e{0} &7is now regenerated!"
  OnMine:
    - "[SOUND] BLOCK_ANVIL_LAND-1-1"
    - "[ACTIONBAR] Your minespeed is {7}/s"
    - "[MESSAGE] &6&lMysteryBlocks &8&l» &7You mined &e{0} &7block. (&6{6}x&7)."
  OnDestroy:
    Global:
      - "[BROADCAST] &6&lMysteryBlocks &8&l» &7Block &b{0} &7was mined! Miners:\
      \ \n&6&lMysteryBlocks &8&l» &r &f1. &e{pos-1-name} &7mined &6{pos-1-value}&7x\
      \ \n&6&lMysteryBlocks &8&l» &r &f2. &e{pos-2-name} &7mined &6{pos-2-value}&7x\
      \ \n&6&lMysteryBlocks &8&l» &r &f3. &e{pos-3-name} &7mined &6{pos-3-value}&7x\
      \ \n&6&lMysteryBlocks &8&l» &r &f4. &e{pos-4-name} &7mined &6{pos-4-value}&7x\
      \ \n&6&lMysteryBlocks &8&l» &r &f5. &e{pos-5-name} &7mined &6{pos-5-value}&7x"
    EveryPlace:
      - "[MESSAGE] &6&lMysteryBlocks &8&l» &7You mined &e{6} &7blocks."
    PerPlace:
      1:
        - "[CONSOLE-COMMAND] say {2} mined most of the stone. Total: {6}x"
      2~3:
        - "[CONSOLE-COMMAND] say {2} was on second or third place"